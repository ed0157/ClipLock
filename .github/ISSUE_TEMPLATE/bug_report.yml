name: Bug report
description: Something in ClipLock is not working as expected
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste real clipboard contents, passwords or keys.** Use made-up examples.
        For a security problem, do not use this form. See SECURITY.md.
  - type: input
    id: version
    attributes:
      label: ClipLock version
      placeholder: "e.g. 1.0.7 (shown in the release you downloaded)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac type
      placeholder: "e.g. macOS 26.0, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
